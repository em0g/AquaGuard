# Install to: /etc/systemd/journald.conf.d/aquaguard-persistent.conf
#
# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# with Storage=volatile, so every log line is lost on reboot. Drop-ins are read
# in lexical order across all directories and later values win, so this file
# ("a...") overrides the stock one ("4...").
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=300M
SystemKeepFree=500M
SystemMaxFileSize=50M
MaxRetentionSec=2month
ForwardToSyslog=no
