# Install to: /etc/NetworkManager/conf.d/aquaguard-wifi-powersave-off.conf
#
# Raspberry Pi OS enables WiFi powersave by default. On the BCM43455/brcmfmac
# the radio can drop the association and fail to re-associate on its own, so
# the Pi silently disappears from the LAN after ~7-14 days of uptime and can
# only be recovered by a power cycle. 2 = disable powersave.
[connection]
wifi.powersave = 2
